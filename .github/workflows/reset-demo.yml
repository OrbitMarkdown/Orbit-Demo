# Resets the live demo's editable branch (`preview`) back to `main` on a schedule.
#
# Model:
#   main    = the pristine, known-good default (never force-pushed; source of truth)
#   preview = what Orbit edits and what the host deploys (the "live" demo)
#
# Every run: if `preview` has drifted from `main` (someone edited it), force it
# back to `main`. If it already matches, do nothing — so the host only rebuilds
# after a real edit, not every 15 minutes (saves build minutes).
name: Reset demo content

on:
  schedule:
    # Every ~15 minutes. GitHub's scheduled runs are best-effort and can be
    # delayed under load, so treat this as "roughly every 15 min", not exact.
    - cron: "*/15 * * * *"
  workflow_dispatch: {} # adds a manual "Run workflow" / reset-now button

# Let the job push branches with the built-in token.
permissions:
  contents: write

# Never let two resets overlap.
concurrency:
  group: reset-demo
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Reset preview to main (only if it drifted)
        run: |
          git fetch origin preview || true
          if git rev-parse --verify --quiet origin/preview >/dev/null \
             && [ "$(git rev-parse origin/preview)" = "$(git rev-parse HEAD)" ]; then
            echo "preview already matches main — nothing to reset."
          else
            echo "preview differs from main (or is missing) — resetting."
            git push --force origin HEAD:preview
          fi
