# Orbit MD site configuration — edit in the app (⚙) or by hand.

assetsDir: src/assets
branches:
    default: preview
    allowed:
        - preview
collections:
    drinks:
        canAdd: true
        newFolders: true
    pages:
        canAdd: false
    posts:
        canAdd: true
        noAddTo:
            - archive
        newFolders: true
    specials:
        canAdd: true
        bodyless: true
site:
    title: Fernway Coffee
    favicon: public/favicon.svg
    defaultRole: editor
components:
    - name: Callout
      description: A highlighted note box
      children: true
      props:
        - name: kind
          type: enum
          options:
            - note
            - tip
            - warning
          default: note
        - name: title
          type: string
    - name: Figure
      description: A captioned image
      props:
        - name: src
          type: string
        - name: alt
          type: string
        - name: caption
          type: string
data:
    - path: src/data/nav.json
      label: Main navigation
    - path: src/data/footer.json
      label: Footer navigation
