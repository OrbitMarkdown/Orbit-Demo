assetsDir: src/assets

site:
  title: Fernway Coffee
  favicon: public/favicon.svg
  defaultRole: editor

branches:
  default: main
  allowed: [main]

snippets:
  compileOnSave: false

data:
  - path: src/data/nav.json
    label: Main navigation
  - path: src/data/footer.json
    label: Footer navigation

# Per-collection rules (also editable in Orbit: Settings ▸ Collections — note that
# saving there rewrites this file without these comments).
collections:
  posts:
    canAdd: true
    # Editors may start new sub-folders. Safe here because the journal route is
    # src/pages/journal/[...slug].astro — a [slug] route would break the build.
    newFolders: true
    # …but never add pages to the archive (or any folder inside it). List more
    # folders to block them too, e.g. ["archive", "drafts"].
    noAddTo: ["archive"]
  drinks:
    canAdd: true
    # Drinks are listed on the menu page (src/pages/menu.astro), with no page of
    # their own, so grouping them in sub-folders can't break any addresses.
    newFolders: true
  specials:
    canAdd: true
    bodyless: true   # frontmatter only — no text editor
  pages:
    canAdd: false    # home/about are fixed pages: editable, but no new ones
    # readOnly: true # would lock them from editing entirely

components:
  - name: Callout
    description: A highlighted note box
    children: true
    props:
      - { name: kind, type: enum, options: [note, tip, warning], default: note }
      - { name: title, type: string }
  - name: Figure
    description: A captioned image
    children: false
    props:
      - { name: src, type: string }
      - { name: alt, type: string }
      - { name: caption, type: string }
